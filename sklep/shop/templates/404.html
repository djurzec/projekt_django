<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Błąd 404 - Nie znaleziono strony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Winylove (CD)</a>
        </div>
    </nav>

    <div class="container mb-5 text-center mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="display-1 fw-bold text-danger">404</h1>
                <h2 class="mb-4">Strona nie została znaleziona</h2>
                <p class="text-muted mb-5">
                    Płyta, której szukasz, nie istnieje lub link był błędny. 
                    Wróć na stronę główną i poszukaj jeszcze raz.
                </p>
                <a href="{% url 'home' %}" class="btn btn-primary btn-lg px-4 shadow-sm">
                    Wróć na stronę główną
                </a>
            </div>
        </div>
    </div>

</body>
</html>
