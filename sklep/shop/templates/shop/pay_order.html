<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Opłać zamówienie - Winylove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Winylove</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5 text-center">
                        <h3 class="fw-bold mb-4">Podsumowanie płatności</h3>
                        <p class="fs-5 mb-2">Płyta: <strong>{{ order.cd.title }}</strong></p>
                        <p class="fs-4 text-success fw-bold mb-4">Do zapłaty: {{ order.cd.price }} zł</p>
                        
                        <div class="alert alert-info small mb-4">
                            To jest projekt testowy. Kliknięcie poniższego przycisku symuluje udaną płatność przez system bankowy i zmieni status zamówienia.
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">Symuluj opłacenie (BLIK / Przelew)</button>
                                <a href="{% url 'my_purchases' %}" class="btn btn-outline-secondary">Anuluj i wróć</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
