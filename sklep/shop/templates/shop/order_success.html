<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sukces!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <div class="card shadow-sm border-0 py-5">
            <div class="card-body">
                <h1 class="display-1 text-success">🎉</h1>
                <h2 class="text-success fw-bold mt-3">Gratulacje! Zakup udany.</h2>
                <p class="lead mt-3">Płyta <strong>{{ offer.title }}</strong> została zamówiona.</p>
                <p class="text-muted">Skontaktuj się ze sprzedawcą ({{ offer.seller.username }}), aby ustalić szczegóły wysyłki.</p>
                <br>
                <a href="{% url 'home' %}" class="btn btn-primary btn-lg mt-3">Wróć na stronę główną</a>
            </div>
        </div>
    </div>
</body>
</html>
