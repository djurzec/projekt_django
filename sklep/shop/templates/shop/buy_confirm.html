<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Podsumowanie zakupu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h2 class="mb-0 fs-4">Podsumowanie zamówienia</h2>
                    </div>
                    <div class="card-body p-4 text-center">
                        <h4 class="text-primary">{{ offer.title }}</h4>
                        <h6 class="text-muted">Wykonawca: {{ offer.artist.name }}</h6>
                        <hr>
                        <h2 class="text-success fw-bold my-4">Do zapłaty: {{ offer.price }} zł</h2>
                        <p class="text-muted small">Sprzedawca: {{ offer.seller.username }}</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg">Potwierdzam zakup i płacę</button>
                                <a href="{% url 'offer_detail' offer.id %}" class="btn btn-outline-secondary">Anuluj i wróć</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
