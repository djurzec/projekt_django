<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuń ofertę - {{ offer.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Winylove</a>
        </div>
    </nav>

    <div class="container mt-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6 mt-5">
                <div class="card shadow-lg border-0 border-danger p-5">
                    <h1 class="display-1 text-danger mb-4">⚠️</h1>
                    <h2 class="fw-bold mb-3">Czy na pewno chcesz usunąć to ogłoszenie?</h2>
                    <p class="lead">Płyta: <strong>{{ offer.title }}</strong></p>
                    <p class="text-muted small">Tej operacji nie będzie można cofnąć.</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-grid gap-3 d-md-flex justify-content-md-center mt-4">
                            <a href="{% url 'offer_detail' offer.id %}" class="btn btn-secondary btn-lg px-4">Anuluj</a>
                            <button type="submit" class="btn btn-danger btn-lg px-4 fw-bold">Tak, usuń bezpowrotnie</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
